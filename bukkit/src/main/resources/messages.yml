# ==========================================================
# MineStormGuilds - Messages  |  Created by Muvixo
# Placeholders: %player%, %guild%, %rank%, %color%, %code%,
#               %master%, %seconds%, %count%, %name%, %target%
# Color codes: use & (e.g. &b, &f)
# ==========================================================
# Aqua & White theme by default.

# Prefix for all plugin messages
prefix: "&b&lMineStorm &f&lGuilds &8» &f"

# Generic
no-permission: "%prefix%&cYou don't have permission to do that."
player-only: "&cOnly players can use this command."
unknown-command: "%prefix%&cUnknown sub-command. Use &b/g help &cto see the list."
reload-done: "%prefix%&aConfiguration and messages reloaded."
data-saved: "%prefix%&aData saved."
invalid-usage: "%prefix%&cUsage: &f%usage%"

# Creator
creator: "&b&lMineStorm &f&lGuilds &8» &fCreated by &bMuvixo"

# Guild lifecycle
guild-created: "%prefix%&aYou created the guild %guild%&a!"
guild-created-hint: "%prefix%&bUse &f/g color &bto pick a color and &f/g tab &bto choose tab display."
guild-disbanded: "%prefix%&cThe guild %guild% &cwas disbanded by %player%."
guild-disband-confirm: "%prefix%&eAre you sure? Type &c/g disband &eagain within 15 seconds to confirm."
already-in-guild: "%prefix%&cYou are already in a guild!"
not-in-guild: "%prefix%&cYou are not in a guild!"
name-taken: "%prefix%&cA guild with that name already exists."
name-invalid: "%prefix%&cGuild names must be %min%-%max% characters (letters, numbers, underscore)."
guild-not-found: "%prefix%&cThat guild doesn't exist."
only-master: "%prefix%&cOnly the Guild Master can do that."
only-manager: "%prefix%&cYou must be the Guild Master or an Officer."
master-cannot-leave: "%prefix%&cYou are the Guild Master! Use &f/g transfer <player> &cor &f/g disband&c."
guild-full: "%prefix%&cThe guild is full."

# Invite / join
invite-sent: "%prefix%&aInvited %target% &eto the guild!"
invite-received: "%prefix%&a%player% &einvited you to &b%guild%&e! You have &b%seconds% &eseconds."
invite-click: "&b&lCLICK HERE &eto join, or run &b/g join %guild%"
invite-hover: "&bClick to join %guild%"
invite-expired: "%prefix%&cYour invite to %guild% has expired."
player-offline: "%prefix%&cThat player is not online."
player-already-in-guild: "%prefix%&cThat player is already in a guild."
invite-already-pending: "%prefix%&cThat player already has a pending invite."
cannot-invite-self: "%prefix%&cYou can't invite yourself."
request-sent: "%prefix%&eYou requested to join %guild%&e. An Officer or the Master must accept."
request-received: "%prefix%&a%player% &ewants to join the guild!"
request-click: "&b&lCLICK HERE &eto accept, or run &b/g accept %player%"
request-hover: "&bClick to accept %player%"
request-already: "%prefix%&cYou already requested to join that guild."
request-none: "%prefix%&cThat player has not requested to join your guild."
join-success: "%prefix%&a%player% &ejoined the guild!"
leave-success: "%prefix%&eYou left the guild %guild%&e."
leave-broadcast: "%prefix%&a%player% &eleft the guild!"
kick-success: "%prefix%&a%target% &cwas kicked from the guild by %player%&c!"
kick-self: "%prefix%&cYou can't kick yourself. Use /g leave."
kick-master: "%prefix%&cYou can't kick the Guild Master."
kick-lower-only: "%prefix%&cYou can only kick members with a lower rank than yours."
target-not-member: "%prefix%&cThat player is not in your guild."

# Ranks
rank-created: "%prefix%&aCreated rank %rank% &a(placed just above Member). Use &f/g promote <player> &ato assign it."
rank-exists: "%prefix%&cThat rank already exists."
rank-deleted: "%prefix%&eThe rank %rank% &ewas deleted. Its members are now &bMember&e."
rank-not-found: "%prefix%&cThat rank doesn't exist."
rank-default-cannot-delete: "%prefix%&cThe default ranks (Guild Master, Officer, Member) can't be deleted."
rank-max: "%prefix%&cYour guild has reached the maximum number of ranks."
rank-name-invalid: "%prefix%&cRank names must be 1-16 characters (letters, numbers, underscore)."
promote-success: "%prefix%&a%player% &ewas promoted from %old% &eto %new%&e!"
demote-success: "%prefix%&a%player% &ewas demoted from %old% &eto %new%&e!"
promote-highest: "%prefix%&c%player% already has the highest rank. Use /g transfer to hand over the guild."
demote-lowest: "%prefix%&c%player% already has the lowest rank."
cannot-change-own-rank: "%prefix%&cYou can't change your own rank."

# Transfer
transfer-success: "%prefix%&a%player% &etransferred the guild to %target%&e!"
transfer-self: "%prefix%&cYou are already the Guild Master."

# Color / Tab
color-set: "%prefix%&eThe guild color is now %code%%name%&e!"
color-current: "%prefix%&eCurrent color: %code%%name%"
tab-set: "%prefix%&eTab display set to &b%mode%&e."
only-master-color: "%prefix%&cOnly the Guild Master can change the guild color."
only-master-tab: "%prefix%&cOnly the Guild Master can change the tab display."
invalid-color: "%prefix%&cInvalid color. Use one of: 0-9, a-f."

# Chat
chat-mode-on: "%prefix%&aGuild chat mode enabled. Use &b/g chat &aagain to disable it."
chat-mode-off: "%prefix%&cGuild chat mode disabled. You talk in public chat again."
chat-no-guild: "%prefix%&cYou are no longer in a guild - guild chat mode disabled."

# Info / List
info-header: "&b&m------------------&f %guild% &b&m------------------"
info-master: "&bGuild Master: &f%master%"
info-members: "&bMembers: &f%count% &7(&a%online% online&7)"
info-your-rank: "&bYour rank: &f%rank%"
info-color: "&bColor: %code%%name%"
info-tab: "&bTab display: &f%mode%"
info-ranks: "&bRanks: &f%ranks%"
info-created: "&bCreated: &f%date%"
list-header: "&b&m------------------&f %guild% &b&m------------------"

# Admin
admin-header: "&b&m------------------&f &b&lAdmin &f&m------------------"
admin-reload: "%prefix%&aReloaded config & messages."
admin-guild-created: "%prefix%&aCreated guild %guild% &afor %target%."
admin-guild-deleted: "%prefix%&cDeleted guild %guild%&c."
admin-guild-not-found: "%prefix%&cNo such guild: %guild%"
admin-color-set: "%prefix%&aColor of %guild% &aset to %code%%name%&a."
admin-tab-set: "%prefix%&aTab of %guild% &aset to &b%mode%&a."
admin-member-added: "%prefix%&aAdded %target% &ato %guild%&a."
admin-member-removed: "%prefix%&cRemoved %target% &cfrom %guild%&c."
admin-cannot-remove-master: "%prefix%&cThat player is the Guild Master. Delete the guild or transfer it first."
admin-player-info: "%prefix%&f%player% &7-> &b%guild% &7(rank: &f%rank%&7)"
admin-player-noguild: "%prefix%&f%player% &7is not in a guild."
admin-player-removed: "%prefix%&cRemoved %player% &cfrom their guild."
